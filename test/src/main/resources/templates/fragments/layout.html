<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="html_head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - PRIME ESTATE PRO MAX'">Hệ Thống Quản Lý Bất Động Sản</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏢%3C/text%3E%3C/svg%3E">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Design system (phải nằm sau Bootstrap) -->
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>

    <!-- Header / Navbar. Truyền 'list' hoặc 'create' để đánh dấu mục đang mở -->
    <header th:fragment="navbar(active)">
        <nav class="navbar navbar-expand-lg navbar-dark navbar-luxury py-3 sticky-top">
            <div class="container-fluid px-lg-5">
                <a class="navbar-brand d-flex align-items-center gap-3 me-4" th:href="@{/transactions}">
                    <span class="brand-mark"><i class="fa-solid fa-building-shield"></i></span>
                    <span>
                        <span class="d-flex align-items-center gap-2">
                            <span class="brand-name">PRIME ESTATE</span>
                            <span class="brand-badge d-none d-sm-inline-flex"><i class="fa-solid fa-crown me-1"></i>VIP PRO MAX</span>
                        </span>
                        <span class="brand-sub d-none d-sm-block">Hệ thống quản lý giao dịch bất động sản</span>
                    </span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Mở menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarMain">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-2 gap-lg-3 my-2 my-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${active == 'list'} ? 'active'" th:href="@{/transactions}">
                                <i class="fa-solid fa-list-check me-2 text-primary-light"></i>Danh sách giao dịch
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-luxury-gold d-inline-flex align-items-center gap-2" th:href="@{/transactions/create}">
                                <i class="fa-solid fa-plus"></i>
                                <span>Thêm mới giao dịch</span>
                            </a>
                        </li>
                        <li class="nav-item ms-lg-2 ps-lg-4 nav-divider d-none d-lg-block">
                            <div class="user-chip">
                                <span class="avatar-ring"><i class="fa-solid fa-user-tie"></i></span>
                                <div>
                                    <div class="user-name">Quản trị viên</div>
                                    <div class="user-status"><span class="status-dot"></span>Đang hoạt động</div>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Footer -->
    <footer th:fragment="footer" class="site-footer mt-auto py-4">
        <div class="container-fluid px-lg-5">
            <div class="row align-items-center gy-2 text-center text-md-start">
                <div class="col-md-6">
                    <span class="small text-muted">
                        <i class="fa-solid fa-shield-halved me-2" style="color: var(--gold-600);"></i>© 2026 Prime Estate Management System •
                    </span>
                </div>
                <div class="col-md-6 text-md-end">
                    <span class="tech-pill me-1"><i class="fa-brands fa-java text-danger"></i>Spring Boot 3 / Java 17</span>
                    <span class="tech-pill"><i class="fa-solid fa-database text-primary"></i>MySQL 8.0</span>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5.3 JS + Custom JS -->
    <div th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/main.js}"></script>
    </div>
</body>
</html>
